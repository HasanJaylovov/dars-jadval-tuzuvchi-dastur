<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dars jadvali — Excel rejimi</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f6;color:#17202a}.top{background:#17202a;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px #0002}.top h1{margin:0 0 4px;font-size:21px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px;background:#fff;border-bottom:1px solid #ccd4dc;position:sticky;top:67px;z-index:25}.toolbar button,.file,select{padding:8px 11px;border:1px solid #b8c2cc;border-radius:6px;background:#fff;cursor:pointer}.primary{background:#1769aa!important;color:#fff;border-color:#1769aa!important}.danger{background:#b42318!important;color:#fff;border-color:#b42318!important}.file input{display:none}.status{margin-left:auto;color:#657381;font-size:13px}.main{padding:9px}.sheet-wrap{height:calc(100vh - 120px);min-height:500px;border:1px solid #aeb8c2;background:#fff;overflow:auto;position:relative}.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;background:#fff}.grid th,.grid td{border-right:1px solid #d7dde3;border-bottom:1px solid #d7dde3;padding:2px 5px;height:22px;min-width:95px;max-width:360px;white-space:pre-wrap;overflow:hidden;vertical-align:middle}.grid th{font-weight:400}.grid .corner,.grid .rh,.grid .ch{background:#edf1f5;color:#3f4a55;text-align:center;position:sticky;z-index:12}.grid .corner{left:0;top:0;width:46px;min-width:46px}.grid .rh{left:0;width:46px;min-width:46px}.grid .ch{top:0}.grid td{font-size:12px;cursor:text}.grid td:focus{outline:2px solid #1677d2;outline-offset:-2px;background:#eaf3ff}.grid td.conflict{background:#fee4e2!important;box-shadow:inset 0 0 0 2px #b42318}.panel{background:#fff;border:1px solid #ccd4dc;border-radius:8px;margin:8px 0;padding:10px}.hidden{display:none}.ok{color:#067647}.error{color:#b42318}.conflict-card{border-left:5px solid #b42318;background:#fff7f6;padding:9px;margin:7px 0;border-radius:6px}.conflict-card button{margin-top:6px;padding:6px 9px;border:1px solid #b8c2cc;border-radius:5px;background:#fff;cursor:pointer}.badge{display:inline-block;padding:2px 7px;border-radius:10px;background:#e8eef5;margin-right:5px;font-size:11px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:100}.modal.show{display:flex}.modal-box{background:#fff;width:min(560px,92vw);max-height:85vh;overflow:auto;border-radius:12px;padding:18px;box-shadow:0 20px 60px #0005}.modal-box h2{margin-top:0}.suggestion{padding:9px;border:1px solid #d3dae2;border-radius:7px;margin:6px 0;cursor:pointer}.suggestion:hover{background:#eef6ff}.muted{color:#667085;font-size:12px}@media(max-width:700px){.toolbar{top:61px}.status{width:100%;margin:0}.sheet-wrap{height:calc(100vh - 145px)}}
</style></head><body>
<div class="top"><h1>📅 DARS JADVALI — Excel rejimi</h1><small>Excel faylini dastur ichida tahrirlash, konfliktlarni topish va avtomatik tuzatish</small></div>
<div class="toolbar"><label class="file">📥 Excel yuklash<input id="file" type="file" accept=".xlsx"></label><select id="sheet" disabled></select><button id="undo" disabled>↶ Undo</button><button id="redo" disabled>↷ Redo</button><button id="check" class="primary" disabled>🔍 Tekshirish</button><button id="auto" disabled>⚙️ Avtomatik tuzatish</button><button id="export" disabled>📤 Excel eksport</button><span id="status" class="status">Excel faylini yuklang</span></div>
<div class="main"><div id="alerts" class="panel hidden"></div><div id="sheetWrap" class="sheet-wrap"><table id="grid" class="grid"></table></div></div>
<div id="modal" class="modal"><div class="modal-box"><h2>🔧 Konfliktni tuzatish</h2><div id="modalText"></div><div id="suggestions"></div><button onclick="closeModal()">Yopish</button></div></div>
<script>
'use strict';let data=null,current=null,originalFile=null,token=null,undoStack=[],redoStack=[],selectedConflict=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function col(n){let s='';while(n>0){let x=(n-1)%26;s=String.fromCharCode(65+x)+s;n=Math.floor((n-1)/26)}return s}
function snapshot(){return JSON.stringify(data)}function restore(s){data=JSON.parse(s);current=data.sheets[Number($('sheet').value)||0];render();updateHistoryButtons()};function pushHistory(){undoStack.push(snapshot());if(undoStack.length>30)undoStack.shift();redoStack=[];updateHistoryButtons()}function updateHistoryButtons(){$('undo').disabled=!undoStack.length;$('redo').disabled=!redoStack.length}
$('file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;originalFile=file;$('status').textContent='⏳ Excel yuklanmoqda...';try{const fd=new FormData();fd.append('file',file);const r=await fetch('/api/upload',{method:'POST',body:fd});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||x.details);data={sheets:x.sheets};token=x.token;$('sheet').innerHTML=data.sheets.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('');$('sheet').disabled=false;['check','auto','export'].forEach(id=>$(id).disabled=false);current=data.sheets[0];undoStack=[];redoStack=[];render();updateHistoryButtons();$('status').textContent=`✓ ${data.sheets.length} ta sheet yuklandi`;}catch(err){$('status').textContent='❌ '+err.message}});
$('sheet').addEventListener('change',()=>{current=data.sheets[Number($('sheet').value)];render();$('alerts').classList.add('hidden')});
function render(){if(!current)return;const rows=current.rows||[];let max=0;rows.forEach(r=>max=Math.max(max,r?.length||0));let h='<thead><tr><th class="corner">#</th>';for(let c=1;c<=max;c++)h+=`<th class="ch">${col(c)}</th>`;h+='</tr></thead><tbody>';for(let r=0;r<rows.length;r++){h+=`<tr><th class="rh">${r+1}</th>`;for(let c=0;c<max;c++){h+=`<td contenteditable="true" data-row="${r}" data-col="${c}">${esc(rows[r]?.[c]??'')}</td>`}h+='</tr>'}h+='</tbody>';$('grid').innerHTML=h;$('grid').querySelectorAll('td').forEach(td=>{td.addEventListener('focus',()=>td.dataset.old=td.textContent);td.addEventListener('blur',()=>{const r=+td.dataset.row,c=+td.dataset.col,v=td.textContent;if((current.rows[r]?.[c]??'')!==v){pushHistory();while(current.rows[r].length<=c)current.rows[r].push('');current.rows[r][c]=v;$('status').textContent=`✎ ${col(c+1)}${r+1} o‘zgartirildi`}});td.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();td.blur()}})})}
$('undo').onclick=()=>{if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop())};$('redo').onclick=()=>{if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop())};
async function checkAll(){const r=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sheets:data.sheets})});const x=await r.json();if(!r.ok)throw Error(x.error||x.details);showConflicts(x.conflicts||[]);return x}
$('check').onclick=async()=>{try{$('status').textContent='⏳ Barcha sheetlar tekshirilmoqda...';const x=await checkAll();$('status').textContent=x.count?`🔴 ${x.count} ta konflikt`:'🟢 Konflikt topilmadi'}catch(e){$('status').textContent='❌ '+e.message}};
function showConflicts(list){const box=$('alerts');box.classList.remove('hidden');document.querySelectorAll('.conflict').forEach(x=>x.classList.remove('conflict'));if(!list.length){box.innerHTML='<div class="ok"><b>🟢 Konflikt topilmadi</b><br>Jadvaldagi o‘qituvchi vaqt to‘qnashuvlari tekshirildi.</div>';return}box.innerHTML=`<div class="error"><b>🔴 ${list.length} ta konflikt</b><div class="muted">Konfliktlar o‘qituvchi doirasida ko‘rsatilmoqda.</div>${list.map((x,i)=>`<div class="conflict-card"><span class="badge">Teacher #${esc(x.teacherId)}</span><span class="badge">${esc(x.day)} — ${esc(x.period)}-dars</span><div>${x.items.map(it=>`<b>${esc(it.className)}</b> — ${esc(it.subject)}`).join(' &nbsp;|&nbsp; ')}</div><button onclick='openFix(${JSON.stringify(x).replace(/'/g,"&#39;")})'>🔧 Qayerga ko‘chirish mumkin?</button></div>`).join('')}</div>`;list.forEach(x=>{if(x.sheet!==current.name)return;x.items.forEach(it=>{const td=$(`td[data-row="${it.row}"][data-col="${it.col}"]`);if(td)td.classList.add('conflict')})})}
window.openFix=async x=>{selectedConflict=x;$('modal').classList.add('show');$('modalText').innerHTML=`<b>Teacher #${esc(x.teacherId)}</b><br>${esc(x.day)}, ${esc(x.period)}-dars<br><br>${x.items.map(i=>`• ${esc(i.className)} — ${esc(i.subject)}`).join('<br>')}`;$('suggestions').innerHTML='<p>⏳ Bo‘sh vaqtlar hisoblanmoqda...</p>';const sheet=data.sheets.find(s=>s.name===x.sheet)||current;const r=await fetch('/api/suggestions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sheet,teacherId:x.teacherId,sourceCol:x.items?.[x.items.length-1]?.col ?? null})});const y=await r.json();$('suggestions').innerHTML=y.suggestions?.length?y.suggestions.map(s=>`<div class="suggestion" onclick='applySuggestion(${JSON.stringify(s)},${JSON.stringify(x)})'>📅 ${esc(s.day)} — ${esc(s.period)}-darsga ko‘chirish</div>`).join(''):'<p class="error">Mos bo‘sh vaqt topilmadi.</p>'};window.closeModal=()=>{$('modal').classList.remove('show');selectedConflict=null};
window.applySuggestion=(s,x)=>{const sheet=data.sheets.find(z=>z.name===x.sheet);if(!sheet)return;const item=x.items[x.items.length-1];const oldRow=sheet.rows[item.row],c=item.col;const targetRow=Number.isInteger(s.row)?s.row:-1;const targetCol=Number.isInteger(s.col)?s.col:c;if(targetRow<0||!sheet.rows[targetRow]){alert('Tanlangan vaqt jadvalda topilmadi.');return}if((sheet.rows[targetRow]?.[targetCol]??'')!==''||(sheet.rows[targetRow]?.[targetCol+1]??'')!==''){alert('Bu vaqtda ushbu sinf uchun joy bo‘sh emas. Boshqa taklifni tanlang.');return}pushHistory();const teacher=oldRow[c]??'',subject=oldRow[c+1]??'';oldRow[c]='';oldRow[c+1]='';while(sheet.rows[targetRow].length<=targetCol+1)sheet.rows[targetRow].push('');sheet.rows[targetRow][targetCol]=teacher;sheet.rows[targetRow][targetCol+1]=subject;current=sheet;render();closeModal();$('status').textContent=`✓ Teacher #${teacher} ${s.day}, ${s.period}-darsga ko‘chirildi`;setTimeout(()=>checkAll().catch(()=>{}),50);};
$('auto').onclick=async()=>{try{const before=snapshot();const x=await checkAll();if(!x.conflicts.length){$('status').textContent='🟢 Avtomatik tuzatish uchun konflikt yo‘q';return}pushHistory();for(const conflict of x.conflicts){const sheet=data.sheets.find(s=>s.name===conflict.sheet);if(!sheet)continue;const item=conflict.items[conflict.items.length-1];const r=sheet.rows[item.row],c=item.col;let moved=false;const suggestions=(await (await fetch('/api/suggestions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sheet,teacherId:conflict.teacherId})})).json()).suggestions||[];for(const s of suggestions){const tr=Number.isInteger(s.row)?s.row:-1;const tc=Number.isInteger(s.col)?s.col:c;if(tr>=0&&sheet.rows[tr]&&clean(sheet.rows[tr]?.[tc])===''&&clean(sheet.rows[tr]?.[tc+1])===''){const teacher=r[c],subject=r[c+1]||'';r[c]='';r[c+1]='';while(sheet.rows[tr].length<=tc+1)sheet.rows[tr].push('');sheet.rows[tr][tc]=teacher;sheet.rows[tr][tc+1]=subject;moved=true;break}}if(!moved)console.warn('Mos joy topilmadi',conflict)}current=data.sheets[Number($('sheet').value)||0];render();const after=await checkAll();$('status').textContent=after.count?`⚠️ ${after.count} ta konflikt qoldi`:'✓ Avtomatik tuzatish tugadi — konfliktlar qolmadi'}catch(e){$('status').textContent='❌ '+e.message}};
$('export').onclick=async()=>{try{$('status').textContent='⏳ Excel saqlanmoqda...';const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,sheets:data.sheets})});if(!r.ok){const x=await r.json();throw Error(x.error||x.details)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dars_jadvali_natija.xlsx';a.click();URL.revokeObjectURL(url);$('status').textContent='✓ Excel tayyorlandi'}catch(e){$('status').textContent='❌ '+e.message}};
</script></body></html>
